# Refreshes the English names for Japanese cards (data/ja/) so new sets get them.
name: Refresh Japanese card names

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japanese-names
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build English names
        run: python3 tools/build_japanese_names.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh English names for Japanese cards"
          git push
